<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050d16">
<title>MRCI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#050d16; --bg2:#0a1826; --card:#0d2338; --card2:#153350;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18);
  --text:#eef3f8; --text-soft:#9fb0c2; --text-mute:#6e8195;
  --accent:#4c9aff; --accent-deep:#1f5fce; --accent-bg:rgba(76,154,255,.14);
  --amber:#f0a93c; --amber-bg:rgba(240,169,60,.14);
  --green:#3ecf8e; --green-bg:rgba(62,207,142,.14);
  --red:#ff6a5f;   --red-bg:rgba(255,106,95,.14);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,.14);
  --teal:#41c9c9;  --teal-bg:rgba(65,201,201,.14);
  --rose:#f472b6;  --rose-bg:rgba(244,114,182,.14);
  --sky:#38bdf8;   --sky-bg:rgba(56,189,248,.14);
  --gray:#9fb0c2;  --gray-bg:rgba(159,176,194,.12);
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
.mute{color:var(--text-mute)} .soft{color:var(--text-soft)} .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)}
.hidden{display:none!important}

/* ---------- shell ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(5,13,22,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding:12px 20px;max-width:1400px;margin:0 auto}
header.top{padding-top:env(safe-area-inset-top)}
html{-webkit-tap-highlight-color:transparent}
.otp{letter-spacing:.4em;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:.02em}
.brand .dot{width:24px;height:24px;border-radius:50%;border:3px solid var(--accent);position:relative;flex:none}
.brand .dot::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent)}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-soft)}
nav.tabs{display:flex;gap:4px;padding:0 16px 10px;max-width:1400px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:999px;color:var(--text-soft);white-space:nowrap;font-weight:500}
nav.tabs a.on{background:var(--accent-bg);color:var(--accent)}
nav.tabs a:hover{color:var(--text)}
main{max-width:1400px;margin:0 auto;padding:20px 20px 90px}
h1{font-size:22px;margin:0 0 4px;font-weight:650} h2{font-size:16px;margin:0 0 12px;font-weight:600}
.sub{color:var(--text-soft);margin:0 0 18px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);cursor:pointer;font-weight:550;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.btn.pri:hover{background:var(--accent)}
.btn.danger{color:var(--red);border-color:rgba(255,106,95,.35);background:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-soft)}
.btn.sm{padding:4px 10px;min-height:28px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
input.in,select.in,textarea.in{width:100%;background:var(--bg2);border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;outline:none;min-height:38px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
textarea.in{min-height:76px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-soft) 50%),linear-gradient(135deg,var(--text-soft) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.toolbar select.in{width:auto;min-width:130px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;font-size:12px;color:var(--text-soft)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.chip b{font-weight:650;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;cursor:pointer;color:var(--text-soft)}
.seg button.on{background:var(--accent-bg);color:var(--accent)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--gray-bg);color:var(--gray)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-sky{background:var(--sky-bg);color:var(--sky)} .c-purple{background:var(--purple-bg);color:var(--purple)}
.c-amber{background:var(--amber-bg);color:var(--amber)} .c-teal{background:var(--teal-bg);color:var(--teal)}
.c-accent{background:var(--accent-bg);color:var(--accent)} .c-rose{background:var(--rose-bg);color:var(--rose)}
.c-green{background:var(--green-bg);color:var(--green)} .c-red{background:var(--red-bg);color:var(--red)}
.c-gray{background:var(--gray-bg);color:var(--gray)}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--amber-bg);color:var(--amber);font-weight:600}

/* ---------- cards / kpis ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--text-soft);margin-bottom:6px}
.kpi .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--text-mute);margin-top:4px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.bar-row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}

/* ---------- catálogo ---------- */
.cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--accent);transform:translateY(-2px)}
.ph{aspect-ratio:1/1;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text-mute);font-size:12px;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .pill{position:absolute;left:8px;top:8px;backdrop-filter:blur(6px)}
.ph .n{position:absolute;right:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px;color:#fff}
.item .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.item .t{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:11.5px;color:var(--text-soft);letter-spacing:.04em;text-transform:uppercase}
.item .p{display:flex;justify-content:space-between;margin-top:auto;padding-top:6px;font-size:12.5px}

/* ---------- tabla ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--text-soft);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
table.t th.r,table.t td.r{text-align:right}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{cursor:pointer} table.t tbody tr:hover td{background:rgba(255,255,255,.03)}
table.t tfoot td{font-weight:650;border-top:1px solid var(--line-strong)}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--bg2);display:block}
.empty{padding:40px;text-align:center;color:var(--text-mute)}

/* ---------- ficha ---------- */
.ficha{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.gal-main{aspect-ratio:1/1;border-radius:var(--r);overflow:hidden;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text-mute);cursor:zoom-in}
.gal-main img{width:100%;height:100%;object-fit:contain}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:10px}
.gal .g{position:relative;aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:var(--bg2);cursor:pointer;border:2px solid transparent}
.gal .g.on{border-color:var(--accent)}
.gal .g img{width:100%;height:100%;object-fit:cover}
.gal .g .star{position:absolute;left:4px;top:3px;font-size:12px;text-shadow:0 1px 3px #000}
.gal .g .tp{position:absolute;bottom:0;left:0;right:0;font-size:9.5px;background:rgba(0,0,0,.6);text-align:center;padding:1px;color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--text-soft)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sec{margin-top:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-h h2{margin:0}
.total{display:flex;justify-content:space-between;border-top:1px solid var(--line-strong);margin-top:8px;padding-top:8px;font-weight:650}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;font-size:13px}
.tl li::before{content:"";position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tl li::after{content:"";position:absolute;left:8.5px;top:15px;bottom:0;width:1px;background:var(--line-strong)}
.tl li:last-child::after{display:none}
.tl .w{font-size:11.5px;color:var(--text-mute)}
.tl .d{color:var(--text-soft);margin-top:2px}
.status-step{display:flex;gap:4px;flex-wrap:wrap}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--line-strong);border-radius:16px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
.fsec{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:650;margin:18px 0 10px;grid-column:1/-1}
.fsec:first-child{margin-top:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--text-soft);font-weight:550}
.fld label .req{color:var(--red)}
.fld .hint{font-size:11px;color:var(--text-mute)}
.sw{display:flex;align-items:center;gap:8px;min-height:38px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.calc{grid-column:1/-1;background:var(--card);border:1px dashed var(--line-strong);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--text-soft)}
.calc:empty{display:none}
.err{background:var(--red-bg);color:var(--red);padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center}
.lb img{max-width:94vw;max-height:88vh;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line-strong);padding:10px 16px;border-radius:10px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
.toast.bad{border-color:var(--red);color:var(--red)}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--accent-deep);color:#fff;border:0;font-size:28px;box-shadow:0 8px 24px rgba(31,95,206,.5);cursor:pointer;z-index:30;display:none}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{max-width:400px;width:100%;padding:28px;display:flex;flex-direction:column;gap:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--text-mute);font-size:12px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.loading{padding:60px;text-align:center;color:var(--text-mute)}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg2);border-radius:10px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

@media (max-width:860px){
  .ficha{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top-row{padding:10px 16px} main{padding:16px 16px 100px}
  nav.tabs{padding:0 12px 8px}
  .user .email{display:none}
  .form{grid-template-columns:1fr}
  .ov{padding:0} .modal{border-radius:0;min-height:100vh;max-width:none;border:0;padding-top:env(safe-area-inset-top)}
  .modal-f{position:sticky;bottom:0;background:var(--bg2);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .item .b{padding:8px 10px 10px}
  .kpi .v{font-size:20px}
  .bar-row{grid-template-columns:110px 1fr 56px}
  .fab{display:block}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .hide-m{display:none}
  .two{grid-template-columns:1fr}
}
</style>

<script>
"use strict";
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const CFG = window.APP_CONFIG || {};
const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const uniq = a => [...new Set(a.filter(v => v !== null && v !== undefined && v !== ""))].sort((x, y) => String(x).localeCompare(String(y), "es"));
const sum  = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const n0 = v => (v === null || v === undefined || v === "") ? null : Number(v);

const NF  = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 });
const NF2 = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = {
  money: v => v === null || v === undefined || v === "" ? "—" : NF2.format(v),
  money0: v => v === null || v === undefined || v === "" ? "—" : NF.format(v),
  jpy: v => v === null || v === undefined || v === "" ? "—" : "¥" + Number(v).toLocaleString("es-MX", { maximumFractionDigits: 0 }),
  usd: v => v === null || v === undefined || v === "" ? "—" : "US$" + Number(v).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
  num: v => v === null || v === undefined || v === "" ? "—" : Number(v).toLocaleString("es-MX"),
  pct: v => v === null || v === undefined || v === "" || !isFinite(v) ? "—" : (v * 100).toFixed(1) + " %",
  date: d => d ? new Date(String(d).slice(0, 10) + "T12:00:00").toLocaleDateString("es-MX", { day: "2-digit", month: "short", year: "numeric" }) : "—",
  dt: d => d ? new Date(d).toLocaleString("es-MX", { day: "2-digit", month: "short", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—",
  bool: v => v ? "Sí" : "No",
};
const signo = v => v === null || v === undefined ? "" : (v >= 0 ? "pos" : "neg");

function toast(msg, bad = false) {
  $$(".toast").forEach(x => x.remove());
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 6000 : 2600);
}
function errMsg(e) {
  const m = e?.message || String(e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Sin conexión a internet. Revisa tu señal e inténtalo de nuevo.";
  if (/duplicate key/.test(m)) return "Ya existe un registro con esa clave.";
  if (/violates foreign key/.test(m)) return "Hay un dato relacionado que no existe o que impide borrar (revisa paquete / artículo / canal).";
  if (/row-level security/.test(m)) return "Tu cuenta no tiene permiso para esta acción.";
  return m;
}

/* =====================================================================
   ESTADO
   ===================================================================== */
let sb = null;
const S = {
  user: null, estatus: [], marcas: [], canales: [], paquetes: [], articulos: [],
  cargos: [], ventas: [], usuarios: [], urls: new Map(),
  ui: { q: "", est: "INV", marca: "", pag: "", orden: "reciente", vista: "grid" },
};
try { Object.assign(S.ui, JSON.parse(localStorage.getItem("inv.ui") || "{}"), { q: "" }); } catch (e) {}
const saveUI = () => { try { localStorage.setItem("inv.ui", JSON.stringify(S.ui)); } catch (e) {} };

const estatusDe = k => S.estatus.find(e => e.clave === k) || { clave: k, nombre: k || "—", orden: 0, color: "gray" };
const pillEst = k => { const e = estatusDe(k); return `<span class="pill c-${esc(e.color)}">${esc(e.nombre)}</span>`; };
const artDe = id => S.articulos.find(a => a.id === id);
const marcaDe = id => S.marcas.find(m => m.id === Number(id))?.nombre;
const ORDEN_VENDIDO = () => estatusDe("VENDIDO").orden || 70;
const enInventario = a => !["PERSONAL", "CANCELADO"].includes(a.estatus) && !a.venta_id && (a.estatus_orden || 0) < ORDEN_VENDIDO();

async function fetchAll(tabla, orden, asc = true) {
  let out = [], from = 0;
  for (;;) {
    let q = sb.from(tabla).select("*");
    if (orden) q = q.order(orden, { ascending: asc });
    const { data, error } = await q.range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function cargarTodo() {
  const [estatus, marcas, canales, paquetes, articulos, cargos, ventas, usuarios] = await Promise.all([
    fetchAll("estatus", "orden"), fetchAll("marcas", "nombre"), fetchAll("canales", "nombre"),

  ]);
  Object.assign(S, { estatus, marcas, canales, paquetes, articulos, cargos, ventas, usuarios });
}

/* ---------- fotos: URLs firmadas (bucket privado) ---------- */
async function urlsDe(rutas) {
  const ahora = Date.now();
  const faltan = uniq(rutas).filter(r => { const c = S.urls.get(r); return !c || c.exp < ahora; });
  for (let i = 0; i < faltan.length; i += 100) {
    const lote = faltan.slice(i, i + 100);
    const { data, error } = await sb.storage.from("fotos").createSignedUrls(lote, 3600);
    if (error) { console.warn(error); continue; }
    (data || []).forEach(d => d.signedUrl && S.urls.set(d.path, { url: d.signedUrl, exp: ahora + 3500e3 }));
  }
  return r => S.urls.get(r)?.url || "";
}
async function comprimir(file, max = 1600, calidad = 0.82) {
  if (!/^image\//.test(file.type) || /gif|svg/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", calidad));
    return blob && blob.size < file.size ? blob : file;
  } catch (e) { return file; }
}
async function subirFoto(articuloId, file, tipo = "catalogo", portada = false) {
  const blob = await comprimir(file);
  const ext = blob.type === "image/jpeg" ? "jpg" : (file.name.split(".").pop() || "jpg").toLowerCase();
  const ruta = `${articuloId}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const up = await sb.storage.from("fotos").upload(ruta, blob, { contentType: blob.type || file.type, upsert: false });
  if (up.error) throw up.error;
  const { error } = await sb.from("fotos").insert({ articulo_id: articuloId, ruta, tipo, es_portada: portada });
  if (error) { await sb.storage.from("fotos").remove([ruta]); throw error; }
}

/* =====================================================================
   FORMULARIO GENÉRICO (alta / edición / baja)
   ===================================================================== */
function inputDe(c, val) {
  const id = `f_${c.k}`;
  const req = c.req ? " required" : "";
  const v = val ?? "";
  switch (c.t) {
    case "textarea": return `<textarea class="in" id="${id}" name="${c.k}"${req}>${esc(v)}</textarea>`;
    case "money": case "jpy": case "usd": case "number":
      return `<input class="in num" id="${id}" name="${c.k}" type="number" step="any" inputmode="decimal" value="${esc(v)}"${req}>`;
    case "date": return `<input class="in" id="${id}" name="${c.k}" type="date" value="${esc(String(v).slice(0, 10))}"${req}>`;
    case "bool": return `<label class="sw"><input type="checkbox" id="${id}" name="${c.k}"${v ? " checked" : ""}> <span>${esc(c.l)}</span></label>`;
    case "select": {
      const ops = c.src ? fuentes[c.src]() : c.opts();
      return `<select class="in" id="${id}" name="${c.k}"${req}><option value="">—</option>${ops.map(([k, l]) => `<option value="${esc(k)}"${String(k) === String(v) ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    }
    case "list": {
      const ops = c.opts ? c.opts() : [];
      return `<input class="in" id="${id}" name="${c.k}" list="dl_${c.k}" value="${esc(v)}" autocomplete="off"${req}><datalist id="dl_${c.k}">${ops.map(o => `<option value="${esc(o)}">`).join("")}</datalist>`;
    }
    case "articulo": {
      const a = artDe(v);
      const shown = v ? `${v}${a ? " · " + a.nombre : ""}` : "";
      return `<input class="in" id="${id}" name="${c.k}" list="dl_art" value="${esc(shown)}" placeholder="Escribe para buscar…" autocomplete="off"${req}>
        <datalist id="dl_art">${S.articulos.map(a => `<option value="${esc(a.id + " · " + a.nombre)}">`).join("")}</datalist>`;
    }
    default: return `<input class="in" id="${id}" name="${c.k}" value="${esc(v)}"${req}>`;
  }
}

function leerForm(form, campos) {
  const v = {};
  for (const c of campos) {
    if (!c.k) continue;
    const el = form.elements[c.k];
    if (!el) continue;
    if (c.t === "bool") { v[c.k] = el.checked; continue; }
    let x = el.value.trim();
    if (x === "") { v[c.k] = c.cero ? 0 : null; continue; }
    if (["money", "jpy", "usd", "number"].includes(c.t)) x = Number(x);
    if (c.t === "articulo") x = x.split(" ")[0];
    if (c.t === "select" && c.src === "marcas") x = Number(x);
    v[c.k] = x;
  }
  return v;
}
function valoresCrudos(form, campos) {
  const v = {};
  campos.forEach(c => { if (c.k && form.elements[c.k]) v[c.k] = c.t === "bool" ? form.elements[c.k].checked : form.elements[c.k].value; });
  return v;
}

function cerrarModal() { $(".ov")?.remove(); document.body.style.overflow = ""; }

function abrirForm(modKey, registro = null, defaults = {}, alGuardar = null) {
  const M = MOD[modKey];
  const nuevo = !registro;
  const base = { ...defaults, ...(registro || {}) };
  M.campos.forEach(c => { if (c.k && nuevo && base[c.k] === undefined && c.def !== undefined) base[c.k] = typeof c.def === "function" ? c.def() : c.def; });

  const cuerpo = M.campos.map(c => {
    if (c.sec) return `<div class="fsec">${esc(c.sec)}</div>`;
    if (c.t === "bool") return `<div class="fld${c.full ? " full" : ""}">${inputDe(c, base[c.k])}</div>`;
    return `<div class="fld${c.full ? " full" : ""}"><label for="f_${c.k}">${esc(c.l)}${c.req ? ' <span class="req">*</span>' : ""}</label>${inputDe(c, base[c.k])}${c.hint ? `<span class="hint">${esc(c.hint)}</span>` : ""}</div>`;
  }).join("");

  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<form class="modal" novalidate>
    <div class="modal-h"><h2>${nuevo ? "Nuevo" : "Editar"} ${esc(M.titulo)}${!nuevo && M.pk === "id" && modKey === "articulos" ? ` <span class="mute num" style="font-size:12px;font-weight:400">${esc(registro.id)}</span>` : ""}</h2>
      <button type="button" class="btn ghost" data-x aria-label="Cerrar">✕</button></div>
    <div class="modal-b"><div class="err hidden"></div><div class="form">${cuerpo}<div class="calc"></div></div></div>
    <div class="modal-f">${!nuevo ? `<button type="button" class="btn danger left" data-del>Eliminar</button>` : ""}
      <button type="button" class="btn" data-x>Cancelar</button><button class="btn pri" type="submit">Guardar</button></div>
  </form>`;
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  const form = $("form", ov);
  const calc = $(".calc", ov);
  const tocado = new Set();
  const refrescar = campo => {
    if (M.auto && campo) {
      const r = M.auto(valoresCrudos(form, M.campos), campo);
      if (r) Object.entries(r).forEach(([k, val]) => { if (!tocado.has(k) && form.elements[k]) form.elements[k].value = val; });
    }
    if (M.calc) calc.innerHTML = M.calc(valoresCrudos(form, M.campos), registro) || "";
  };
  form.addEventListener("input", e => { if (e.isTrusted && e.target.name && M.campos.find(c => c.k === e.target.name)?.auto) tocado.add(e.target.name); refrescar(e.target.name); });
  form.addEventListener("change", e => refrescar(e.target.name));
  refrescar(nuevo ? "canal" : null);
  $$("[data-x]", ov).forEach(b => b.onclick = cerrarModal);
  ov.addEventListener("mousedown", e => { if (e.target === ov) cerrarModal(); });
  setTimeout(() => form.querySelector("input:not([type=checkbox]),select,textarea")?.focus(), 30);

  const err = $(".err", ov);
  const mostrarErr = m => { err.textContent = m; err.classList.remove("hidden"); $(".modal-b", ov).scrollTop = 0; ov.scrollTop = 0; };

  form.onsubmit = async e => {
    e.preventDefault();
    const falt = M.campos.filter(c => c.req && c.t !== "bool" && !form.elements[c.k].value.trim()).map(c => c.l);
    if (falt.length) return mostrarErr("Falta: " + falt.join(", "));
    const v = leerForm(form, M.campos);
    if (v.articulo_id && !artDe(v.articulo_id)) return mostrarErr("Ese artículo no existe. Elige uno de la lista.");
    const btn = $("button[type=submit]", form); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      if (M.antes) await M.antes(v, registro);
      let res;
      if (nuevo) res = await sb.from(M.tabla).insert(v).select().single();
      else res = await sb.from(M.tabla).update(v).eq(M.pk, registro[M.pk]).select().single();
      if (res.error) throw res.error;
      cerrarModal();
      toast(nuevo ? "Guardado ✓" : "Cambios guardados ✓");
      await cargarTodo();
      if (alGuardar) alGuardar(res.data); else render();
    } catch (ex) {
      mostrarErr(errMsg(ex)); btn.disabled = false; btn.textContent = "Guardar";
    }
  };
  const del = $("[data-del]", ov);
  if (del) del.onclick = async () => {
    const extra = modKey === "articulos" ? "\n\nSe borrarán también su venta y sus fotos. El historial se conserva." : "";
    if (!confirm(`¿Eliminar este ${M.titulo}?${extra}`)) return;
    try {
      if (modKey === "articulos") {
        const { data: fs } = await sb.from("fotos").select("*").eq("articulo_id", registro.id);
        if (fs?.length) await sb.storage.from("fotos").remove(fs.map(f => f.ruta));
      }
      const { error } = await sb.from(M.tabla).delete().eq(M.pk, registro[M.pk]);
      if (error) throw error;
      cerrarModal(); toast("Eliminado");
      await cargarTodo();
      if (modKey === "articulos") location.hash = "#/catalogo"; else render();
    } catch (ex) { mostrarErr(errMsg(ex)); }
  };
}

/* =====================================================================
   TABLA GENÉRICA (orden por columna + total + CSV)
   ===================================================================== */
function tabla(cont, { filas, cols, alClick, totales = [], clave = "t" }) {
  const st = (tabla.st[clave] ||= { k: null, asc: true });
  const pinta = () => {
    let fs = filas.slice();
    if (st.k) {
      const c = cols.find(c => c.k === st.k);
      const val = c.v || (r => r[c.k]);
      fs.sort((a, b) => {
        const x = val(a), y = val(b);
        if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
        const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "es", { numeric: true });
        return st.asc ? r : -r;
      });
    }
    if (!fs.length) { cont.innerHTML = `<div class="tw"><div class="empty">Sin registros</div></div>`; return; }
    cont.innerHTML = `<div class="tw"><table class="t"><thead><tr>${cols.map(c => `<th class="${c.r ? "r" : ""} ${c.hm ? "hide-m" : ""}" data-k="${c.k}">${esc(c.l)}${st.k === c.k ? (st.asc ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead>
      <tbody>${fs.map((r, i) => `<tr data-i="${filas.indexOf(r)}">${cols.map(c => `<td class="${c.r ? "r num" : ""} ${c.hm ? "hide-m" : ""}">${c.h ? c.h(r) : esc(c.f ? c.f(r[c.k]) : r[c.k] ?? "—")}</td>`).join("")}</tr>`).join("")}</tbody>
      ${totales.length ? `<tfoot><tr>${cols.map((c, i) => `<td class="${c.r ? "r num" : ""} ${c.hm ? "hide-m" : ""}">${i === 0 ? `${fs.length} registros` : totales.includes(c.k) ? esc((c.f || fmt.money)(sum(fs, c.v || (r => r[c.k])))) : ""}</td>`).join("")}</tr></tfoot>` : ""}
    </table></div>`;
    $$("th", cont).forEach(th => th.onclick = () => { st.asc = st.k === th.dataset.k ? !st.asc : true; st.k = th.dataset.k; pinta(); });
    $$("tbody tr", cont).forEach(tr => tr.onclick = e => { if (!e.target.closest("button,a")) alClick?.(filas[+tr.dataset.i]); });
    cont.dispatchEvent(new CustomEvent("pintado"));
  };
  pinta();
}
tabla.st = {};

function csv(nombre, filas, cols) {
  const q = v => { const s = v == null ? "" : String(v); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const txt = [cols.map(c => q(c.l)).join(","), ...filas.map(r => cols.map(c => q(c.v ? c.v(r) : r[c.k])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + txt], { type: "text/csv;charset=utf-8" }));
  a.download = `${nombre}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const buscar = (filas, q, campos) => { const t = norm(q).trim(); if (!t) return filas; return filas.filter(r => campos.some(k => norm(typeof k === "function" ? k(r) : r[k]).includes(t))); };

    <div class="card kpi"><div class="l">Utilidad esperada del inventario</div><div class="v ${signo(sum(inv, a => a.utilidad_esperada))}">${fmt.money0(sum(inv, a => a.utilidad_esperada))}</div><div class="s">${inv.filter(a => !a.precio_objetivo).length} sin precio objetivo</div></div>
    <div class="card kpi"><div class="l">Vendidos</div><div class="v">${vend.length}</div><div class="s">Ventas ${fmt.money0(ingreso)}${diasProm != null ? ` · ${diasProm} días promedio` : ""}</div></div>
    <div class="card kpi"><div class="l">Utilidad realizada</div><div class="v ${signo(util)}">${fmt.money0(util)}</div><div class="s">Margen ${fmt.pct(ingreso ? util / ingreso : null)}</div></div>

  </div>
  <div class="grid two">

  $$("[data-est]", main).forEach(a => a.onclick = () => { S.ui.est = a.dataset.est; saveUI(); });

function pick(reg, M) { const o = {}; M.campos.forEach(c => { if (c.k) o[c.k] = reg[c.k]; }); o[M.pk] = reg[M.pk]; return o; }

function lightbox(urls, i) {
  const lb = document.createElement("div");
  lb.className = "lb";
  const pinta = () => lb.innerHTML = `<img src="${esc(urls[i])}" alt=""><button style="top:16px;right:16px" data-c>✕</button>${urls.length > 1 ? `<button style="left:12px;top:50%" data-p>‹</button><button style="right:12px;top:50%" data-n>›</button>` : ""}`;
  pinta();
  lb.onclick = e => {
    if (e.target.dataset.p !== undefined) { i = (i - 1 + urls.length) % urls.length; pinta(); }
    else if (e.target.dataset.n !== undefined) { i = (i + 1) % urls.length; pinta(); }
    else if (e.target.tagName !== "IMG") lb.remove();
  };
  document.body.appendChild(lb);
}

/* ---------- línea de historial legible ---------- */
const ETIQ = Object.fromEntries(Object.values(MOD).flatMap(M => M.campos.filter(c => c.k).map(c => [c.k, c.l])));
const TABLA_NOM = { articulos: "Artículo", ventas: "Venta", cargos_tc: "Cargo TC", fotos: "Foto", paquetes: "Paquete" };
function valHist(k, v) {
  if (v === null || v === undefined || v === "") return "vacío";
  if (k === "estatus") return estatusDe(v).nombre;
  if (k === "marca_id") return marcaDe(v) || v;
  if (/_mxn$|^precio_venta$|^precio_objetivo$|^monto/.test(k)) return fmt.money(v);
  if (/_jpy$/.test(k)) return fmt.jpy(v);
  if (typeof v === "boolean") return v ? "Sí" : "No";
  return String(v);
}
function lineaHist(r, enFicha = false) {
  const c = r.cambios || {};
  const art = !enFicha && r.articulo_id ? artDe(r.articulo_id) : null;
  const ref = art ? ` · <a href="#/a/${esc(art.id)}">${esc(art.nombre)}</a>` : (!enFicha && r.tabla === "paquetes" ? ` · ${esc(r.registro_id)}` : "");
  let titulo, det = "";
  if (r.accion === "CAMBIO") {
    const ks = Object.keys(c);
    if (ks.length === 1 && ks[0] === "estatus") titulo = `Estatus: ${esc(valHist("estatus", c.estatus.de))} → <b>${esc(valHist("estatus", c.estatus.a))}</b>`;
    else if (r.tabla === "fotos" && ks.includes("es_portada")) titulo = "Cambio de portada";
    else {
      titulo = `${TABLA_NOM[r.tabla] || r.tabla} editado`;
      det = ks.map(k => `${esc(ETIQ[k] || k)}: ${esc(valHist(k, c[k].de))} → ${esc(valHist(k, c[k].a))}`).join("<br>");
    }
  } else if (r.accion === "ALTA") {
    titulo = { articulos: "Artículo creado", ventas: `Venta registrada · ${fmt.money(c.precio_venta)}${c.canal ? " en " + esc(c.canal) : ""}`, cargos_tc: `Cargo TC (${esc(c.concepto || "")}) · ${fmt.money(c.monto_mxn)}`, fotos: "Foto agregada", paquetes: `Paquete ${esc(c.numero || "")} creado` }[r.tabla] || "Alta";
    if (r.tabla === "articulos" && c.notas && /Migrado/.test(c.notas)) det = "Migrado desde el Excel";
  } else {
    titulo = `${TABLA_NOM[r.tabla] || r.tabla} eliminado`;
  }
  return `<li><div>${titulo}${ref}</div>${det ? `<div class="d">${det}</div>` : ""}<div class="w">${fmt.dt(r.fecha)} · ${esc((r.usuario || "").split("@")[0])}</div></li>`;
}

    <div class="card"><div id="l" class="mute">Cargando…</div></div>`;
  const pinta = async () => {
    let q = sb.from("historial").select("*").order("fecha", { ascending: false }).limit(300);
    if ($("#tb").value) q = q.eq("tabla", $("#tb").value);
    const { data, error } = await q;
    if (error) throw error;
    $("#l").innerHTML = data.length ? `<ul class="tl">${data.map(r => lineaHist(r)).join("")}</ul>` : "Sin movimientos";
  };
  $("#tb").onchange = pinta;
  await pinta();
}

/* ---------- CATÁLOGOS / AJUSTES ---------- */
function vAjustes(main) {
  main.innerHTML = `<h1>Catálogos</h1><p class="sub">Listas que alimentan los formularios</p>
  <div class="grid two">
    <div class="card"><div class="sec-h"><h2>Marcas</h2><button class="btn sm" data-n="marcas">+ Marca</button></div><div id="tm"></div></div>
    <div class="card"><div class="sec-h"><h2>Canales de venta</h2><button class="btn sm" data-n="canales">+ Canal</button></div><div id="tc"></div></div>
    <div class="card"><div class="sec-h"><h2>Estatus (flujo)</h2><button class="btn sm" data-n="estatus">+ Estatus</button></div><div id="te"></div></div>
    <div class="card"><h2>Mi contraseña</h2>
      <p class="soft" style="margin-top:0">Ponle contraseña a tu cuenta (<b>${esc(S.user?.email || "")}</b>) para entrar sin esperar correos. Mínimo 8 caracteres.</p>
      <form id="cpf" style="display:flex;flex-direction:column;gap:8px">
        <input type="email" value="${esc(S.user?.email || "")}" autocomplete="username" hidden>
        <input class="in" type="password" id="np1" placeholder="Nueva contraseña" autocomplete="new-password" minlength="8" required>
        <input class="in" type="password" id="np2" placeholder="Repite la contraseña" autocomplete="new-password" minlength="8" required>
        <button class="btn pri">Guardar contraseña</button>
      </form></div>
    <div class="card"><h2>Usuarios con acceso</h2>${S.usuarios.map(u => `<div style="padding:4px 0">${esc(u.nombre || "")} <span class="mute">${esc(u.email)}</span></div>`).join("")}
      <p class="mute" style="font-size:12px">Para agregar a alguien: Supabase → Table Editor → <b>usuarios_permitidos</b> → Insert row.</p></div>
    <div class="card" style="grid-column:1/-1"><h2>Importar fotos en lote</h2>
      <p class="soft" style="margin-top:0">Selecciona varias fotos cuyo nombre empiece con el ID del artículo (ej. <span class="num">3780ca7b.jpg</span>, <span class="num">3780ca7b_2.jpg</span>). Así se suben las fotos que venían en tu Excel (carpeta <b>fotos_migracion</b>).</p>
      <label class="btn"><input type="file" id="lote" accept="image/*" multiple hidden>⬆ Elegir fotos</label>
      <div class="log hidden" id="log" style="margin-top:10px"></div></div>
  </div>`;
  tabla($("#tm"), { filas: S.marcas.map(m => ({ ...m, n: S.articulos.filter(a => a.marca_id === m.id).length })), clave: "cm", alClick: m => abrirForm("marcas", { id: m.id, nombre: m.nombre }), cols: [{ k: "nombre", l: "Marca" }, { k: "n", l: "Artículos", r: 1 }] });
  tabla($("#tc"), { filas: S.canales, clave: "cc", alClick: c => abrirForm("canales", c), cols: [{ k: "nombre", l: "Canal" }, { k: "comision_pct", l: "%", r: 1 }, { k: "comision_fija", l: "Fija", r: 1, f: fmt.money }] });
  tabla($("#te"), { filas: S.estatus, clave: "ce", alClick: e => abrirForm("estatus", e), cols: [{ k: "orden", l: "#", r: 1 }, { k: "nombre", l: "Estatus", h: r => pillEst(r.clave) }, { k: "clave", l: "Clave" }] });
  $$("[data-n]", main).forEach(b => b.onclick = () => abrirForm(b.dataset.n));
  $("#cpf").onsubmit = async e => {
    e.preventDefault();
    const p1 = $("#np1").value, p2 = $("#np2").value;
    if (p1.length < 8) return toast("Usa al menos 8 caracteres.", true);
    if (p1 !== p2) return toast("Las contraseñas no coinciden.", true);
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) return toast(/different/i.test(error.message) ? "Esa ya es tu contraseña actual." : /weak|short/i.test(error.message) ? "Contraseña muy débil: usa letras y números." : errMsg(error), true);
    $("#cpf").reset(); toast("Contraseña guardada ✓ Ya puedes entrar con ella.");
  };
  $("#lote").onchange = async e => {
    const files = [...e.target.files]; e.target.value = "";
    const log = $("#log"); log.classList.remove("hidden"); log.textContent = "";
    const linea = t => { log.textContent += t + "\n"; log.scrollTop = 1e9; };
    const conFoto = new Set(S.articulos.filter(a => a.num_fotos > 0).map(a => a.id));
    let ok = 0;
    for (const f of files.sort((a, b) => a.name.localeCompare(b.name))) {
      const m = f.name.match(/^([0-9a-z]{8})/i);
      const id = m && S.articulos.find(a => a.id.toLowerCase() === m[1].toLowerCase())?.id;
      if (!id) { linea(`✗ ${f.name}: no encontré un artículo con ese ID`); continue; }
      try { await subirFoto(id, f, "catalogo", !conFoto.has(id)); conFoto.add(id); ok++; linea(`✓ ${f.name} → ${artDe(id).nombre}`); }
      catch (ex) { linea(`✗ ${f.name}: ${errMsg(ex)}`); }
    }
    linea(`\nListo: ${ok} de ${files.length} fotos subidas.`);
    await cargarTodo();
  };
}

/* =====================================================================
   ARRANQUE / LOGIN
   ===================================================================== */
function pantallaLogin(msg = "") {
  const url = location.origin + location.pathname;
  $("#root").innerHTML = `<div class="login"><div class="card">
    <div class="brand"><span class="dot"></span><span>${esc(CFG.NOMBRE_APP || "Inventario")}</span></div>
    <p class="soft" style="margin:0">Trazabilidad de compras, envíos, ventas y catálogo con fotos.</p>
    ${msg ? `<div class="err">${msg}</div>` : ""}
    <form id="pf" style="display:flex;flex-direction:column;gap:8px">
      <input class="in" type="email" id="pmail" placeholder="tu@correo.com" autocomplete="username" required>
      <input class="in" type="password" id="ppass" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="btn pri">Entrar</button>
    </form>
    <div class="or">¿primera vez u olvidaste tu contraseña?</div>
    <button class="btn" id="verlink" type="button">Entrar con un enlace a mi correo</button>
    <form id="mf" class="hidden" style="display:flex;flex-direction:column;gap:8px"><input class="in" type="email" id="mail" placeholder="tu@correo.com" required><button class="btn pri">Enviarme el enlace</button>
      <span class="mute" style="font-size:12px">Después de entrar, ve a <b>Catálogos → Mi contraseña</b> para ponerle una.</span></form>
  </div></div>`;
  $("#pf").onsubmit = async e => {
    e.preventDefault();
    const b = $("#pf button"); b.disabled = true; b.textContent = "Entrando…";
    const { error } = await sb.auth.signInWithPassword({ email: $("#pmail").value.trim(), password: $("#ppass").value });
    b.disabled = false; b.textContent = "Entrar";
    if (error) toast(/invalid login|credentials/i.test(error.message) ? "Correo o contraseña incorrectos." : /not confirmed/i.test(error.message) ? "Primero confirma tu correo con el enlace." : errMsg(error), true);
  };
  $("#verlink").onclick = () => { $("#mf").classList.remove("hidden"); $("#verlink").classList.add("hidden"); $("#mail").value = $("#pmail").value; $("#mail").focus(); };
  $("#mf").onsubmit = async e => {
    e.preventDefault();
    const email = $("#mail").value.trim();
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: url, shouldCreateUser: true } });
    if (error) return toast(/rate limit|too many/i.test(error.message) ? "Ya se pidieron varios correos. Espera unos minutos e inténtalo de nuevo." : errMsg(error), true);
    $("#mf").innerHTML = `<div class="soft">Te enviamos un correo a <b>${esc(email)}</b>. Ábrelo <b>en este mismo dispositivo</b> y dale clic al enlace. Si el correo trae un código, escríbelo aquí:</div>
      <input class="in otp" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••">
      <button class="btn" id="verif" type="button">Entrar con el código</button>`;
    const verificar = async () => {
      const token = $("#otp").value.replace(/\D/g, "");
      if (token.length < 6) return toast("Escribe el código completo", true);
      const { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
      if (error) toast(/expired|invalid/i.test(error.message) ? "Código incorrecto o vencido. Pide uno nuevo." : errMsg(error), true);
    };
    $("#verif").onclick = verificar;
    $("#otp").onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); verificar(); } };
  };
  if (PWA.esIOS && !PWA.instalada) {
    const t = document.createElement("p"); t.className = "mute"; t.style.cssText = "font-size:12px;margin:0";
    t.innerHTML = "📲 Para instalarla en tu iPhone: botón <b>Compartir</b> → <b>Agregar a pantalla de inicio</b>.";
    $(".login .card").appendChild(t);
  }
}

async function entrar(session) {
  S.user = session.user;
  const { data: ok, error } = await sb.rpc("es_permitido");
  if (error || !ok) {
    pantallaLogin(`La cuenta <b>${esc(S.user.email || "")}</b> no tiene acceso. Pide que la agreguen a <b>usuarios_permitidos</b>.`);
    const b = document.createElement("button"); b.className = "btn"; b.textContent = "Usar otra cuenta";
    b.onclick = async () => { await sb.auth.signOut(); location.reload(); };
    $(".login .card").appendChild(b);
    return;
  }
  $("#root").innerHTML = `<div class="loading">Cargando datos…</div>`;
  try { await cargarTodo(); } catch (e) { $("#root").innerHTML = `<div class="login"><div class="card"><div class="err">${esc(errMsg(e))}</div>${/conexión/.test(errMsg(e)) ? `<button class="btn" onclick="location.reload()">Reintentar</button>` : `<p class="soft">¿Ya corriste <b>sql/01_esquema.sql</b> en Supabase?</p>`}</div></div>`; return; }
  render();
}

/* ---------- PWA: instalación y service worker ---------- */
const PWA = {
  prompt: null,
  esIOS: /iphone|ipad|ipod/i.test(navigator.userAgent),
  instalada: matchMedia("(display-mode: standalone)").matches || navigator.standalone === true,
};
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); PWA.prompt = e; $("#instalar")?.classList.remove("hidden"); });
window.addEventListener("appinstalled", () => { PWA.prompt = null; $("#instalar")?.classList.add("hidden"); toast("App instalada ✓"); });
async function instalarPWA() {
  if (!PWA.prompt) return;
  PWA.prompt.prompt();
  await PWA.prompt.userChoice;
  PWA.prompt = null; $("#instalar")?.classList.add("hidden");
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW", e)));

(async function init() {
  if (CFG.SUPABASE_URL && !window.supabase) {
    $("#root").innerHTML = `<div class="login"><div class="card"><div class="brand"><span class="dot"></span><span>${esc(CFG.NOMBRE_APP || "Inventario")}</span></div>
      <div class="err">Sin conexión a internet. Conéctate y vuelve a abrir la app.</div><button class="btn" onclick="location.reload()">Reintentar</button></div></div>`;
    return;
  }
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) {
    $("#root").innerHTML = `<div class="login"><div class="card"><div class="brand"><span class="dot"></span><span>Falta configurar</span></div>
      <p class="soft">Abre <b>config.js</b> y pega la URL y la anon key de tu proyecto Supabase (Project Settings → API). Los pasos completos están en el README.</p></div></div>`;
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });
  let dentro = false;
  sb.auth.onAuthStateChange((ev, session) => {
    if (session && !dentro) { dentro = true; setTimeout(() => entrar(session), 0); }
    if (ev === "SIGNED_OUT") { dentro = false; S.user = null; pantallaLogin(); }
  });
  const { data } = await sb.auth.getSession();
  if (data.session) { if (!dentro) { dentro = true; entrar(data.session); } }
  else pantallaLogin();
})();
</script>
